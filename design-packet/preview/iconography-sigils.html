<!doctype html>
<html><head><meta charset="utf-8"><title>Sigils</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<main class="card-root">
  <div class="label-tiny" style="margin-bottom:12px">UNICODE SIGILS // NO ICON FONT // NEVER EMOJI</div>
  <div style="display:grid; grid-template-columns: repeat(6, 1fr); gap:10px; text-align:center;">
    <div><div style="font-family:var(--font-display); font-size:28px; color:#5ee1ff; text-shadow:0 0 10px rgba(94,225,255,0.55);">▸</div><div class="label-tiny" style="margin-top:4px">SPEAK</div></div>
    <div><div style="font-family:var(--font-display); font-size:28px; color:#4ade80; text-shadow:0 0 10px rgba(74,222,128,0.55);">▲</div><div class="label-tiny" style="margin-top:4px">UP</div></div>
    <div><div style="font-family:var(--font-display); font-size:28px; color:#ff6b6b; text-shadow:0 0 10px rgba(255,107,107,0.6);">▼</div><div class="label-tiny" style="margin-top:4px">DOWN</div></div>
    <div><div style="font-family:var(--font-display); font-size:28px; color:#4a5475;">▬</div><div class="label-tiny" style="margin-top:4px">FLAT</div></div>
    <div><div style="font-family:var(--font-display); font-size:28px; color:#4ade80; text-shadow:0 0 10px rgba(74,222,128,0.55);">◆</div><div class="label-tiny" style="margin-top:4px">ACTIVE</div></div>
    <div><div style="font-family:var(--font-display); font-size:28px; color:#ff6b6b;">◇</div><div class="label-tiny" style="margin-top:4px">STALE</div></div>
    <div><div style="font-family:var(--font-display); font-size:28px; color:#3b82f6; text-shadow:0 0 10px rgba(59,130,246,0.55);">◈</div><div class="label-tiny" style="margin-top:4px">ARCHITECT</div></div>
    <div><div style="font-family:var(--font-display); font-size:28px; color:#ef4444; text-shadow:0 0 10px rgba(239,68,68,0.55);">⬢</div><div class="label-tiny" style="margin-top:4px">IRON</div></div>
    <div><div style="font-family:var(--font-display); font-size:28px; color:#5ee1ff; text-shadow:0 0 10px rgba(94,225,255,0.55);">▲</div><div class="label-tiny" style="margin-top:4px">SHADOW</div></div>
    <div><div style="font-family:var(--font-display); font-size:18px; color:#8896b5;">::</div><div class="label-tiny" style="margin-top:4px">SEP 1</div></div>
    <div><div style="font-family:var(--font-display); font-size:18px; color:#8896b5;">//</div><div class="label-tiny" style="margin-top:4px">SEP 2</div></div>
    <div><div style="font-family:var(--font-display); font-size:18px; color:#ffd76a;">[ ]</div><div class="label-tiny" style="margin-top:4px">WRAP</div></div>
  </div>
</main>
</body></html>
