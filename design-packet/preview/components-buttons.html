<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
  .btn { font-family: var(--font-mono); cursor:pointer; background:transparent;
    border:1px solid rgba(100,180,255,0.3); color:#d9e5ff; padding:8px 14px;
    letter-spacing:0.2em; text-transform:uppercase; font-size:11px; transition:all 180ms var(--ease-out); }
  .btn:hover { border-color: rgba(120,220,255,0.6); color:#5ee1ff; box-shadow:0 0 18px rgba(94,225,255,0.55); }
  .btn.hot { border-color: rgba(120,220,255,0.6); color:#5ee1ff; box-shadow:0 0 18px rgba(94,225,255,0.55); }
  .btn.legendary { color:#ffd76a; border-color:#ffd76a; background:rgba(255,215,106,0.08); box-shadow:0 0 10px rgba(255,215,106,0.85); }
  .btn.danger { color:#ef4444; border-color:#ef4444; }
  .btn.disabled { opacity:0.35; cursor:not-allowed; }
</style></head>
<body>
<main class="card-root">
  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
    <button class="btn">▸ DEFAULT</button>
    <button class="btn hot">▸ HOVER / FOCUS</button>
    <button class="btn legendary">◆ ALLOCATE +1</button>
    <button class="btn danger">▼ DISCONNECT</button>
    <button class="btn disabled">▸ DISABLED</button>
  </div>
  <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
    <button class="btn" style="padding:4px 10px; font-size:10px;">▸ SMALL</button>
    <button class="btn hot" style="padding:12px 20px; font-size:12px;">▸ INITIALIZE FITBIT SYNC</button>
    <span class="label-tiny">PRESS = GLOW COMMIT · NO DEPRESS STATE</span>
  </div>
</main>
</body></html>
