<!doctype html>
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="_card.css">
<style> @keyframes pg { 0%,100% { box-shadow: 0 0 14px #5ee1ff; } 50% { box-shadow: 0 0 28px #5ee1ff; } } </style>
</head>
<body>
<main class="card-root">
  <div style="display:flex; align-items:center; gap:12px;">
    <span style="width:10px; height:10px; border-radius:50%; background:#5ee1ff; animation: pg 1.8s ease-in-out infinite;"></span>
    <span style="font-family:Orbitron; font-weight:900; font-size:28px; letter-spacing:0.3em; color:#5ee1ff; text-shadow:0 0 18px rgba(94,225,255,0.55); text-transform:uppercase;">PARALLAX GATE</span>
  </div>
  <div style="font-family:JetBrains Mono, monospace; font-size:10px; letter-spacing:0.3em; color:#8896b5; text-transform:uppercase; margin-top:6px; padding-left:22px;">:: SYSTEM INTERFACE //</div>
  <div style="margin-top:14px; display:flex; gap:14px; align-items:center;">
    <div style="width:56px; height:56px; border:1.5px solid #5ee1ff; display:grid; place-items:center; font-family:Orbitron; font-weight:900; font-size:22px; color:#5ee1ff; text-shadow:0 0 10px rgba(94,225,255,0.55); box-shadow:0 0 16px rgba(94,225,255,0.4);">PG</div>
    <span class="label-tiny">MARK · 56PX MIN · SHARP SQUARE · CYAN ON VOID</span>
  </div>
</main>
