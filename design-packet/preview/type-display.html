<!doctype html>
<html><head><meta charset="utf-8"><title>Display Type</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<main class="card-root">
  <div class="label-tiny" style="margin-bottom:10px">ORBITRON :: DISPLAY // HEADINGS + NUMERICS</div>
  <div style="font-family:var(--font-display); font-weight:900; font-size:32px; letter-spacing:0.2em; color:#d9e5ff; text-transform:uppercase;">AWAKEN, HUNTER</div>
  <div style="font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:0.2em; color:#5ee1ff; text-shadow:0 0 12px rgba(94,225,255,0.55); text-transform:uppercase; margin-top:6px;">RANK-UP CEREMONY</div>
  <div style="font-family:var(--font-display); font-weight:700; font-size:14px; letter-spacing:0.3em; color:#5ee1ff; text-transform:uppercase; margin-top:6px;">▸ STATUS VITALS</div>
  <div style="display:flex; align-items:baseline; gap:18px; margin-top:14px">
    <span style="font-family:var(--font-display); font-weight:900; font-size:56px; color:#ef4444; text-shadow:0 0 16px rgba(239,68,68,0.75); letter-spacing:0.04em;">87</span>
    <span style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.25em; color:#8896b5; text-transform:uppercase;">/ 100 STR</span>
    <span style="font-family:var(--font-display); font-weight:900; font-size:34px; color:#ffd76a; text-shadow:0 0 14px rgba(255,215,106,0.85);">S</span>
  </div>
</main>
</body></html>
