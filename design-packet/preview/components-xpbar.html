<!doctype html>
<html><head><meta charset="utf-8"><title>XP Bar</title>
<link rel="stylesheet" href="_card.css">
<style>
  @keyframes shim { 0%{ background-position:-200% 0;} 100%{ background-position:200% 0;} }
</style></head>
<body>
<main class="card-root">
  <div class="label-tiny" style="margin-bottom:10px">XP BAR — TICKED, SHIMMERED, RANK-COLORED</div>
  <div style="width:100%;">
    <div style="display:flex; justify-content:space-between; font-size:10px; letter-spacing:0.2em; color:#8896b5; margin-bottom:6px; text-transform:uppercase;">
      <span>RANK C :: SOLO RAIDER</span><span>180 / 250 XP → B</span>
    </div>
    <div style="height:12px; width:100%; border:1px solid rgba(100,180,255,0.3); background:rgba(0,0,0,0.5); position:relative; overflow:hidden;">
      <div style="height:100%; width:72%; background:linear-gradient(90deg,#3b82f6 0%,rgba(255,255,255,0.4) 50%,#3b82f6 100%); background-size:200% 100%; animation: shim 3s linear infinite; box-shadow:0 0 18px rgba(59,130,246,0.6), inset 0 0 8px rgba(255,255,255,0.3);"></div>
      <div style="position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent 0, transparent 22px, rgba(0,0,0,0.25) 22px, rgba(0,0,0,0.25) 23px); pointer-events:none;"></div>
    </div>
  </div>
  <div style="width:100%; margin-top:16px;">
    <div style="display:flex; justify-content:space-between; font-size:10px; letter-spacing:0.2em; color:#8896b5; margin-bottom:6px; text-transform:uppercase;">
      <span>RANK S :: MONARCH</span><span>MAX RANK ACHIEVED</span>
    </div>
    <div style="height:12px; width:100%; border:1px solid #ef4444; background:rgba(0,0,0,0.5); position:relative; overflow:hidden;">
      <div style="height:100%; width:100%; background:linear-gradient(90deg,#ef4444 0%,rgba(255,255,255,0.4) 50%,#ef4444 100%); background-size:200% 100%; animation: shim 3s linear infinite; box-shadow:0 0 22px rgba(239,68,68,0.75), inset 0 0 8px rgba(255,255,255,0.3);"></div>
    </div>
  </div>
</main>
</body></html>
