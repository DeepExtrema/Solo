<!doctype html>
<html><head><meta charset="utf-8"><title>Rank Spectrum</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<main class="card-root">

    <div class="swatch" style="background:#8a8a98; box-shadow:0 0 14px rgba(138,138,152,0.55)"><span class="tok">E / AWAKENED</span><span class="hex">#8a8a98</span></div>
    <div class="swatch" style="background:#4ade80; box-shadow:0 0 14px rgba(74,222,128,0.55)"><span class="tok" style="color:#06180c">D / HUNTER</span><span class="hex" style="color:rgba(0,0,0,0.55)">#4ade80</span></div>

  </div>
  <div class="label-tiny" style="margin-top:12px">:: ASH → VIRIDIAN → AZURE → AMETHYST → AMBER → CRIMSON ::  ONE DOMINANT AT A TIME VIA body[data-rank="X"]</div>

</body></html>
