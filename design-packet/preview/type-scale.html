<!doctype html>
<html><head><meta charset="utf-8"><title>Type Scale</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<main class="card-root">
  <div style="display:grid; grid-template-columns: 80px 1fr 90px; gap:10px 14px; align-items:baseline;">
    <span class="label-tiny">48 / 900</span><span style="font-family:var(--font-display); font-weight:900; font-size:48px; color:#d9e5ff; letter-spacing:0.04em;">87</span><span class="label-tiny">hero-num</span>
    <span class="label-tiny">32 / 900</span><span style="font-family:var(--font-display); font-weight:900; font-size:32px; color:#d9e5ff; letter-spacing:0.2em; text-transform:uppercase;">H1</span><span class="label-tiny">Orbitron</span>
    <span class="label-tiny">22 / 800</span><span style="font-family:var(--font-display); font-weight:800; font-size:22px; color:#d9e5ff; letter-spacing:0.2em; text-transform:uppercase;">H2</span><span class="label-tiny">Orbitron</span>
    <span class="label-tiny">14 / 800</span><span style="font-family:var(--font-display); font-weight:800; font-size:14px; color:#5ee1ff; letter-spacing:0.3em; text-transform:uppercase;">H3 ▸ TITLE</span><span class="label-tiny">Orbitron</span>
    <span class="label-tiny">14 / 500</span><span style="font-family:var(--font-mono); font-size:14px; color:#d9e5ff;">Body — default reading size</span><span class="label-tiny">JetBrains</span>
    <span class="label-tiny">11 / 500</span><span style="font-family:var(--font-mono); font-size:11px; color:#8896b5; letter-spacing:0.25em; text-transform:uppercase;">LABEL</span><span class="label-tiny">JetBrains</span>
    <span class="label-tiny">9 / 500</span><span style="font-family:var(--font-mono); font-size:9px; color:#4a5475; letter-spacing:0.3em; text-transform:uppercase;">NANO</span><span class="label-tiny">JetBrains</span>
  </div>
</main>
</body></html>
