<!doctype html>
<html><head><meta charset="utf-8"><title>Rank Badges</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<main class="card-root">
  <div style="display:grid; grid-template-columns: repeat(6, 1fr); gap:14px; align-items:end;">
    <div style="text-align:center;"><div style="width:48px; height:48px; border:1.5px solid #8a8a98; color:#8a8a98; display:grid; place-items:center; font-family:Orbitron; font-weight:900; font-size:22px; background:rgba(0,0,0,0.4); box-shadow:0 0 14px rgba(138,138,152,0.55), inset 0 0 10px rgba(255,255,255,0.04); margin:0 auto;">E</div><div class="label-tiny" style="margin-top:8px; color:#8a8a98">AWAKENED</div></div>
    <div style="text-align:center;"><div style="width:48px; height:48px; border:1.5px solid #4ade80; color:#4ade80; display:grid; place-items:center; font-family:Orbitron; font-weight:900; font-size:22px; background:rgba(0,0,0,0.4); box-shadow:0 0 14px rgba(74,222,128,0.55), inset 0 0 10px rgba(255,255,255,0.04); margin:0 auto;">D</div><div class="label-tiny" style="margin-top:8px; color:#4ade80">HUNTER</div></div>
    <div style="text-align:center;"><div style="width:48px; height:48px; border:1.5px solid #3b82f6; color:#3b82f6; display:grid; place-items:center; font-family:Orbitron; font-weight:900; font-size:22px; background:rgba(0,0,0,0.4); box-shadow:0 0 14px rgba(59,130,246,0.6), inset 0 0 10px rgba(255,255,255,0.04); margin:0 auto;">C</div><div class="label-tiny" style="margin-top:8px; color:#3b82f6">RAIDER</div></div>
    <div style="text-align:center;"><div style="width:48px; height:48px; border:1.5px solid #a855f7; color:#a855f7; display:grid; place-items:center; font-family:Orbitron; font-weight:900; font-size:22px; background:rgba(0,0,0,0.4); box-shadow:0 0 14px rgba(168,85,247,0.6), inset 0 0 10px rgba(255,255,255,0.04); margin:0 auto;">B</div><div class="label-tiny" style="margin-top:8px; color:#a855f7">RANKED</div></div>
    <div style="text-align:center;"><div style="width:48px; height:48px; border:1.5px solid #fbbf24; color:#fbbf24; display:grid; place-items:center; font-family:Orbitron; font-weight:900; font-size:22px; background:rgba(0,0,0,0.4); box-shadow:0 0 14px rgba(251,191,36,0.65), inset 0 0 10px rgba(255,255,255,0.04); margin:0 auto;">A</div><div class="label-tiny" style="margin-top:8px; color:#fbbf24">ELITE</div></div>
    <div style="text-align:center;"><div style="width:48px; height:48px; border:1.5px solid #ef4444; color:#ef4444; display:grid; place-items:center; font-family:Orbitron; font-weight:900; font-size:22px; background:rgba(0,0,0,0.4); box-shadow:0 0 18px rgba(239,68,68,0.75), inset 0 0 10px rgba(255,255,255,0.04); margin:0 auto;">S</div><div class="label-tiny" style="margin-top:8px; color:#ef4444">MONARCH</div></div>
  </div>
</main>
</body></html>
