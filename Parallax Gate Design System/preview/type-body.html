<!doctype html>
<html><head><meta charset="utf-8"><title>Body &amp; Mono Type</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<main class="card-root">
  <div class="label-tiny" style="margin-bottom:10px">JETBRAINS MONO :: BODY // LABELS // CODE</div>
  <div style="font-family:var(--font-mono); font-size:14px; color:#d9e5ff; line-height:1.55;">
    Body 14px — <em>The smallest gates obey you now. The hunt has its rhythm. Continue.</em>
  </div>
  <div style="font-family:var(--font-mono); font-size:12px; color:#8896b5; margin-top:8px;">
    Caption 12px — secondary meta and helper text.
  </div>
  <div style="font-family:var(--font-mono); font-size:11px; letter-spacing:0.25em; color:#8896b5; text-transform:uppercase; margin-top:8px;">
    LABEL 11px :: UPPERCASE TRACKED
  </div>
  <div style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.3em; color:#4a5475; text-transform:uppercase; margin-top:6px;">
    10PX META :: TIMESTAMPS // COUNTS
  </div>
  <div style="font-family:var(--font-mono); font-size:9px; letter-spacing:0.3em; color:#4a5475; text-transform:uppercase; margin-top:6px;">
    9PX NANO :: IDX LABELS
  </div>
  <div style="margin-top:12px; font-family:var(--font-mono); font-size:12px; color:#5ee1ff; background:rgba(94,225,255,0.06); border:1px solid rgba(80,120,200,0.15); padding:4px 8px; display:inline-block;">
    const rank = rankFromXP(xp)
  </div>
</main>
</body></html>
