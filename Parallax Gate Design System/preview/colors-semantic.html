<!doctype html>
<html><head><meta charset="utf-8"><title>Semantic Colors</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<main class="card-root">
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;">
    <div class="swatch" style="background:#5ee1ff; box-shadow:0 0 20px rgba(94,225,255,0.55)"><span class="tok" style="color:#002830">--sys-cyan</span><span class="hex" style="color:rgba(0,0,0,0.55)">NARRATOR</span></div>
    <div class="swatch" style="background:#ffd76a; box-shadow:0 0 22px rgba(255,215,106,0.85)"><span class="tok" style="color:#261a00">--legendary</span><span class="hex" style="color:rgba(0,0,0,0.6)">EARNED</span></div>
    <div class="swatch" style="background:#4ade80"><span class="tok" style="color:#06180c">--ok</span><span class="hex" style="color:rgba(0,0,0,0.55)">ONLINE / UP</span></div>
    <div class="swatch" style="background:#ff6b6b"><span class="tok">--warn</span><span class="hex" style="color:rgba(0,0,0,0.6)">DEBUFF / DOWN</span></div>
  </div>
  <div style="margin-top:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
    <span class="chip" style="color:#4ade80; border-color:#4ade80">◆ FITBIT SYNC ACTIVE</span>
    <span class="chip" style="color:#ff6b6b; border-color:#ff6b6b">◇ STALE</span>
    <span class="chip" style="color:#5ee1ff; border-color:#5ee1ff">▸ SYSTEM</span>
    <span class="chip" style="color:#ffd76a; border-color:#ffd76a">◆ +2 ALLOC</span>
  </div>
</main>
</body></html>
