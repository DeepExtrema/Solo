<!doctype html>
<html><head><meta charset="utf-8"><title>Classes</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<main class="card-root">
  <div class="label-tiny" style="margin-bottom:10px">JOB CHANGE :: B-RANK UNLOCK — THREE CLASSES</div>
  <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:12px;">
    <div style="padding:14px; background:rgba(0,0,0,0.4); border:1px solid #3b82f6; box-shadow:0 0 16px rgba(59,130,246,0.4);">
      <div style="font-family:Orbitron; font-size:34px; color:#3b82f6; text-shadow:0 0 14px rgba(59,130,246,0.6);">◈</div>
      <div style="font-family:Orbitron; font-weight:800; font-size:12px; letter-spacing:0.2em; color:#3b82f6; margin-top:6px;">ARCHITECT</div>
      <div style="font-size:10px; color:#8896b5; margin-top:4px; line-height:1.4;">Systems obey the hand that writes the axioms.</div>
    </div>
    <div style="padding:14px; background:rgba(0,0,0,0.4); border:1px solid #ef4444; box-shadow:0 0 16px rgba(239,68,68,0.4);">
      <div style="font-family:Orbitron; font-size:34px; color:#ef4444; text-shadow:0 0 14px rgba(239,68,68,0.6);">⬢</div>
      <div style="font-family:Orbitron; font-weight:800; font-size:12px; letter-spacing:0.2em; color:#ef4444; margin-top:6px;">IRON SOVEREIGN</div>
      <div style="font-size:10px; color:#8896b5; margin-top:4px; line-height:1.4;">The body is the first fortress. Hold it, and hold everything.</div>
    </div>
    <div style="padding:14px; background:rgba(0,0,0,0.4); border:1px solid #5ee1ff; box-shadow:0 0 16px rgba(94,225,255,0.4);">
      <div style="font-family:Orbitron; font-size:34px; color:#5ee1ff; text-shadow:0 0 14px rgba(94,225,255,0.55);">▲</div>
      <div style="font-family:Orbitron; font-weight:800; font-size:12px; letter-spacing:0.2em; color:#5ee1ff; margin-top:6px;">SHADOW RAIDER</div>
      <div style="font-size:10px; color:#8896b5; margin-top:4px; line-height:1.4;">Speed is a sovereignty. Move before the Gate remembers your name.</div>
    </div>
  </div>
</main>
</body></html>
