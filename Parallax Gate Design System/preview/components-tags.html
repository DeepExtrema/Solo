<!doctype html>
<html><head><meta charset="utf-8"><title>Tags &amp; Status Pills</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<main class="card-root">
  <div class="label-tiny" style="margin-bottom:10px">TAGS // STATUS PILLS — 1PX BORDER, 9–10PX, NO FILL</div>
  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
    <span class="chip" style="color:#4ade80; border-color:#4ade80">◆ FITBIT LIVE</span>
    <span class="chip" style="color:#4ade80; border-color:#4ade80">◆ LEETCODE LIVE</span>
    <span class="chip" style="color:#ff6b6b; border-color:#ff6b6b">◇ STALE</span>
    <span class="chip" style="color:#ff6b6b; border-color:#ff6b6b">FITBIT OFFLINE</span>
    <span class="chip" style="color:#8896b5">QUEST-BASED</span>
    <span class="chip" style="color:#5ee1ff; border-color:#5ee1ff">▸ SYSTEM</span>
    <span class="chip" style="color:#ffd76a; border-color:#ffd76a">◆ +2 ALLOC</span>
    <span class="chip" style="color:#ef4444; border-color:#ef4444">▼ [DEBUFFED -12]</span>
  </div>
  <div style="margin-top:16px; display:flex; gap:12px; align-items:center;">
    <span style="width:8px; height:8px; border-radius:50%; background:#4ade80; box-shadow:0 0 10px #4ade80; display:inline-block;"></span>
    <span style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.25em; color:#8896b5; text-transform:uppercase;">ONLINE LED — 8PX PILL, SOLID + 10PX GLOW</span>
  </div>
  <div style="margin-top:8px; display:flex; gap:12px; align-items:center;">
    <span style="width:8px; height:8px; border-radius:50%; background:#5ee1ff; box-shadow:0 0 14px #5ee1ff; display:inline-block; animation: pulseGlow 1.8s ease-in-out infinite;"></span>
    <span style="font-family:var(--font-mono); font-size:10px; letter-spacing:0.25em; color:#8896b5; text-transform:uppercase;">BRAND DOT — PULSING 1.8S</span>
  </div>
</main>
</body></html>
