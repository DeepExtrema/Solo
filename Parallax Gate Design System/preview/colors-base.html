<!doctype html>
<html><head><meta charset="utf-8"><title>Core Palette</title>
<link rel="stylesheet" href="_card.css"></head>
<body>
<main class="card-root">
  <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:10px;">
    <div class="swatch" style="background:#05060a"><span class="tok">--bg-void</span><span class="hex">#05060a</span></div>
    <div class="swatch" style="background:#0a0a0f"><span class="tok">--bg-deep</span><span class="hex">#0a0a0f</span></div>
    <div class="swatch" style="background:linear-gradient(180deg,#0d0f18,#121524)"><span class="tok">--bg-panel*</span><span class="hex">0d0f18→121524</span></div>
    <div class="swatch" style="background:#161a2b"><span class="tok">--bg-elevated</span><span class="hex">#161a2b</span></div>
    <div class="swatch" style="background:#05060a; border-color: var(--border-hot); box-shadow: 0 0 18px var(--sys-cyan-glow);"><span class="tok" style="color:#5ee1ff">--sys-cyan</span><span class="hex" style="color:#5ee1ff">#5ee1ff</span></div>
  </div>
  <div class="label-tiny" style="margin-top:12px">:: VOID → PANEL → ELEVATED // CYAN IS NEUTRAL NARRATOR ::</div>
</main>
</body></html>
