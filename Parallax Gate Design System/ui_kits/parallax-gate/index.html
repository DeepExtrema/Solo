<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Parallax Gate — UI Kit</title>
  <link rel="stylesheet" href="kit.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body data-rank="C">
  <div id="root"></div>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="panels.jsx"></script>
  <script type="text/babel" src="BiometricWidget.jsx"></script>
  <script type="text/babel" src="SkillTree.jsx"></script>
  <script type="text/babel" src="Ceremony.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [tab, setTab] = useState('STATUS');
      const [xp, setXP]   = useState(320);
      const [stats, setStats] = useState({ STR: 72, VIT: 61, INT: 84, AGI: 58, SEN: 48, CHA: 35 });
      const [ceremony, setCeremony] = useState(null);

      useEffect(() => {
        const p = rankProgress(xp);
        document.body.setAttribute('data-rank', p.current.key);
      }, [xp]);

      // expose a global trigger so any inner button (e.g. profile panel) can fire ceremony
      useEffect(() => {
        window.__triggerCeremony = () => {
          const cur = rankFromXP(xp);
          const nxt = nextRank(cur.key) || cur;
          setCeremony({ from: cur.key, to: nxt.key });
        };
        return () => { delete window.__triggerCeremony; };
      }, [xp]);

      return (
        <div className="shell">
          <Runes />
          <TopBar />
          <div className="shell-body">
            <Sidebar tab={tab} setTab={setTab} xp={xp} />
            <main className="main">
              {tab === 'STATUS'    && <StatusPanel stats={stats} setStats={setStats} xp={xp} />}
              {tab === 'RECOVERY'  && <BiometricWidget />}
              {tab === 'SKILLTREE' && <SkillTreePanel />}
              {tab === 'QUESTS'    && <QuestLogPanel />}
              {tab === 'JOURNAL'   && <JournalPanel />}
              {tab === 'PROFILE'   && <ProfilePanel stats={stats} xp={xp} setXP={setXP} />}
              {tab === 'CONFIG'    && <ConfigPanel />}
            </main>
          </div>
          {ceremony && <Ceremony fromRank={ceremony.from} toRank={ceremony.to} onClose={() => setCeremony(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
